name: Send Remote Command

on:
  workflow_dispatch: # يتيح لك تشغيل الأكشن يدوياً بزر التشغيل من المتصفح

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Execute Script
        run: python send_command.py
